name: Phase 2 review build
on:
  push:
    branches: ['phase2/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -U -pl polder-core -am clean verify
      - name: Package Core review build
        run: |
          mkdir -p dist/phase2/config
          cp polder-core/target/PolderCore.jar dist/phase2/
          cp polder-core/src/main/resources/*.yml dist/phase2/config/
          cp README.md BUILD-REPORT.txt dist/phase2/
          git archive --format=zip -o dist/phase2/Source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PolderCore-Phase2-review
          path: dist/phase2/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-tests
          path: '**/target/surefire-reports/*'
