name: Phase 3 competition build
on:
  push:
    branches: ['phase3/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -U -pl polder-core -am clean verify
      - name: Package competitions
        run: |
          mkdir -p dist/phase3/config
          cp polder-core/target/PolderCore.jar dist/phase3/
          cp polder-core/src/main/resources/*.yml dist/phase3/config/
          cp README.md BUILD-REPORT.txt dist/phase3/
          git archive --format=zip -o dist/phase3/Source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PolderCore-Phase3
          path: dist/phase3/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-tests
          path: '**/target/surefire-reports/*'
