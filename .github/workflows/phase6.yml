name: Phase 6 Nether maintenance build
on:
  push:
    branches: ['phase6/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -U -pl polder-core -am clean verify
      - name: Package Nether maintenance
        run: |
          mkdir -p dist/phase6/config
          cp polder-core/target/PolderCore.jar dist/phase6/
          cp polder-core/src/main/resources/*.yml dist/phase6/config/
          cp README.md BUILD-REPORT.txt dist/phase6/
          cp -r maintenance dist/phase6/
          git archive --format=zip -o dist/phase6/Source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PolderCore-Phase6
          path: dist/phase6/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-tests
          path: '**/target/surefire-reports/*'
  windows-maintenance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -U -pl polder-core -am clean verify
      - name: Validate Windows PowerShell scripts and offline recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem maintenance/*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw $parseErrors }
          }
          $java = Join-Path $env:JAVA_HOME 'bin/java.exe'
          $core = (Resolve-Path 'polder-core/target/PolderCore.jar').Path
          $classes = Join-Path $env:RUNNER_TEMP 'fixture-classes'
          New-Item -ItemType Directory -Path $classes | Out-Null
          & javac -proc:none -cp $core -d $classes polder-core/src/integration/java/nl/poldersmp/core/nether/MaintenanceFixture.java
          if ($LASTEXITCODE) { throw 'Fixture compile failed' }
          $cp = "$core;$classes"
          $root = Join-Path $env:RUNNER_TEMP 'synthetic-nether-fixture'
          & $java -cp $cp nl.poldersmp.core.nether.MaintenanceFixture init $root
          if ($LASTEXITCODE) { throw 'Fixture setup failed' }
          Copy-Item $core (Join-Path $root 'plugins/PolderCore.jar')
          ./maintenance/Nether-Maintenance.ps1 -Action apply -ServerRoot $root -JavaExe $java
          & $java -cp $cp nl.poldersmp.core.nether.MaintenanceFixture archived $root
          if ($LASTEXITCODE) { throw 'Archive verification failed' }
          $operation = Get-Content -Raw (Join-Path $root 'operation.txt')
          ./maintenance/Nether-Maintenance.ps1 -Action recover -ServerRoot $root -JavaExe $java -OperationId $operation
          & $java -cp $cp nl.poldersmp.core.nether.MaintenanceFixture recovered $root
          if ($LASTEXITCODE) { throw 'Recovery verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-windows-tests
          path: '**/target/surefire-reports/*'
