name: PolderCore
version: 1.0.0-SNAPSHOT
main: nl.poldersmp.core.PolderCore
softdepend: [Vault, LuckPerms]
api-version: '1.21.11'
description: PolderSMP foundation and Phase 2 gameplay
commands:
  poldercore:
    description: PolderCore administration
    usage: /poldercore <info|reload|debug>
  weapons:
    description: Legendary weapon collection
  weaponinfo:
    description: Inspect held legendary weapon
  weaponadmin:
    description: Manage legendary weapons
  armorinfo:
    description: Inspect equipped armor trims
  armorcollection:
    description: Discovered armor patterns
  armortop:
    description: Armor discovery leaderboard
  armoradmin:
    description: Manage armor trims
  bounty:
    description: Fund or inspect a bounty
  bounties:
    description: Bounty leaderboard GUI
  bountyadmin:
    description: Fund, reduce or refund bounties
  king:
    description: King of the SMP competition
permissions:
  poldercore.info:
    default: op
  poldercore.reload:
    default: op
  poldercore.debug:
    default: op
  polder.weapons.use:
    default: true
  polder.weapons.view:
    default: true
  polder.weapons.admin:
    default: op
  polder.armor.use:
    default: true
  polder.armor.view:
    default: true
  polder.armor.inspect:
    default: op
  polder.armor.admin:
    default: op
  polder.bounty.use:
    default: true
  polder.bounty.admin:
    default: op
  polder.king.play:
    default: true
  polder.king.view:
    default: true
  polder.king.admin:
    default: op
  polder.king.current:
    default: false
  polder.king.exempt:
    default: false
